      - main [ref=f20e69]:
        - generic [ref=f20e71]:
          - heading [level=1] [ref=f20e72]:
            - text: About Mneme
            - link "Permalink to \"About Mneme\"" [ref=f20e73] [cursor=pointer]:
              - /url: "#about-mneme"
              - text: "#"
          - paragraph [ref=f20e74]:
            - text: Mneme is a local-document Retrieval-Augmented Generation (RAG) system named after
            - strong [ref=f20e75]: Mnemosyne
            - text: ", the Greek goddess of memory in Greek mythology."
          - heading [level=2] [ref=f20e76]:
            - text: Project Goal
            - link "Permalink to \"Project Goal\"" [ref=f20e77] [cursor=pointer]:
              - /url: "#project-goal"
              - text: "#"
          - paragraph [ref=f20e78]: Turn a local document collection into a verifiable, queryable memory. Every answer should be traceable to a specific file, page, and chunk.
          - heading [level=2] [ref=f20e79]:
            - text: What Mneme Is
            - link "Permalink to \"What Mneme Is\"" [ref=f20e80] [cursor=pointer]:
              - /url: "#what-mneme-is"
              - text: "#"
          - list [ref=f20e81]:
            - listitem [ref=f20e82]:
              - text: A
              - strong [ref=f20e83]: Python CLI
              - text: for one-shot and batch document Q&A
            - listitem [ref=f20e84]:
              - text: A
              - strong [ref=f20e85]: bilingual terminal UI
              - text: (TUI) for interactive sessions with file watching
            - listitem [ref=f20e86]:
              - text: A
              - strong [ref=f20e87]: hybrid retrieval engine
              - text: combining semantic search (ChromaDB + Sentence Transformers) and lexical search (BM25)
            - listitem [ref=f20e88]:
              - text: A
              - strong [ref=f20e89]: Graph RAG
              - text: mode for cross-document relationship queries
            - listitem [ref=f20e90]:
              - text: A
              - strong [ref=f20e91]: safety-first
              - text: system with explicit data boundaries, endpoint validation, and resource limits
          - heading [level=2] [ref=f20e92]:
            - text: What Mneme Is Not
            - link "Permalink to \"What Mneme Is Not\"" [ref=f20e93] [cursor=pointer]:
              - /url: "#what-mneme-is-not"
              - text: "#"
          - list [ref=f20e94]:
            - listitem [ref=f20e95]: Not a cloud service — all indexing happens locally
            - listitem [ref=f20e96]: Not a guarantee that data never leaves your machine — retrieved snippets are sent to your configured LLM endpoint
            - listitem [ref=f20e97]: Not a replacement for reading the original documents — it augments reading with fast retrieval and summarization
          - heading [level=2] [ref=f20e98]:
            - text: Architecture Principles
            - link "Permalink to \"Architecture Principles\"" [ref=f20e99] [cursor=pointer]:
              - /url: "#architecture-principles"
              - text: "#"
          - list [ref=f20e100]:
            - listitem [ref=f20e101]:
              - strong [ref=f20e102]: Identity first
              - text: — stable
              - code [ref=f20e103]: source_id
              - text: ","
              - code [ref=f20e104]: chunk_id
              - text: ", and content hashes prevent index drift"
            - listitem [ref=f20e105]:
              - strong [ref=f20e106]: Versioned mutations
              - text: — atomic manifest updates keep vector store, BM25, and graph cache aligned
            - listitem [ref=f20e107]:
              - strong [ref=f20e108]: Explicit boundaries
              - text: — untrusted-document tags separate retrieved text from system instructions
            - listitem [ref=f20e109]:
              - strong [ref=f20e110]: Measurable quality
              - text: — benchmark utilities for Recall@k, MRR, nDCG, and quality gates
            - listitem [ref=f20e111]:
              - strong [ref=f20e112]: Offline-safe tests
              - text: — CI runs without API keys; integration tests are opt-in
